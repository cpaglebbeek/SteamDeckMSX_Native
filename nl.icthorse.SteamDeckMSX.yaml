# Flatpak manifest — SteamDeckMSX_Native v0.2.1-KingsValley
#
# REVISIE 2026-07-24 (BUG-011, RCA in BUGLIST.md):
# - runtime org.freedesktop.Platform 23.08 → org.kde.Platform 6.7: fd.o-runtime
#   bevat GEEN Qt6 — vermoedelijke root cause van 5 eerdere buildfails.
#   KDE 6.7 = Qt 6.7 → qzipreader_p.h zit daar nog in QtGui (BUG-009 fallback).
# - --share=network TOEGEVOEGD: herziening v0.0.2-besluit "offline". Sinds
#   v0.1.0 zijn URL-import (ROMs) + BIOS-downloads kernfeatures; hiermee laadt
#   de Deck-app Nemesis 1+2 direct van https://horsecloud55.ddns.net/steam/konami/
# - Overig ongewijzigd: subprocess-koppeling, portal i.p.v. --filesystem=home,
#   Steam Input passthrough via --device=input (P-SDM-06)

app-id: nl.icthorse.SteamDeckMSX
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: steamdeckmsx

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  # --device=input (fijnmazig, P-SDM-06) vereist flatpak ≥1.15.6; HC55-builder
  # én potentieel oudere SteamOS-runtimes zitten op 1.14.x → --device=all
  # (superset: dri + input + overige devices) als compatibele terugval (BUG-014).
  - --device=all
  - --persist=.var/app/nl.icthorse.SteamDeckMSX
  # v0.3.0-MazeOfGalious: de bibliotheek scant lokale ROM-mappen. Zonder deze
  # rechten ziet de sandbox alleen zijn eigen storage en blijft de galerij leeg.
  # Read-only en beperkt tot de plekken waar ROMs realistisch staan — bewust
  # geen --filesystem=home, want dat geeft toegang tot de hele home-map.
  - --filesystem=xdg-download:ro
  - --filesystem=xdg-documents:ro
  # Steam Deck: SD-kaart en andere externe media.
  - --filesystem=/run/media:ro
  # openmsx-binary heeft DATADIR=/opt/openMSX/share hardcoded (custom.mk);
  # env-override wijst naar de share-tree in de Flatpak-prefix (BUG-012).
  # Pad = /app/share/openmsx (machines/ direct eronder) — conform
  # OpenmsxLocator::discoverDataPath() kandidaat 2 (BUG-004-fix).
  - --env=OPENMSX_SYSTEM_DATA=/app/share/openmsx

modules:
  # Tcl 8.6 — harde dependency van openMSX' emulation core; zit NIET in de
  # KDE-SDK (BUG-011: probe gaf "Tcl: no" → "Emulation core: no").
  # GLEW ontbreekt óók maar is optioneel (alleen GL-renderer; SDL-renderer volstaat).
  - name: tcl
    buildsystem: autotools
    subdir: unix
    config-opts:
      - --enable-shared
      - --enable-threads
    build-commands: []
    post-install:
      - chmod 755 ${FLATPAK_DEST}/lib/libtcl8.6.so
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tcl8.6.16-src.tar.gz
        sha256: 91cb8fa61771c63c262efb553059b7c7ad6757afa5857af6265e4b0bdc2a14a5

  # GLEW — openMSX v21 include't GL/glew.h onvoorwaardelijk (ook zonder
  # GL-renderer-component); KDE-SDK levert geen GLEW (BUG-011).
  - name: glew
    buildsystem: simple
    build-commands:
      - make SYSTEM=linux GLEW_DEST=${FLATPAK_DEST} LIBDIR=${FLATPAK_DEST}/lib -j${FLATPAK_BUILDER_N_JOBS:-4}
      - make SYSTEM=linux GLEW_DEST=${FLATPAK_DEST} LIBDIR=${FLATPAK_DEST}/lib install
      - chmod 755 ${FLATPAK_DEST}/lib/libGLEW.so.2.2.0
      # KDE-SDK heeft geen GL/glu.h; openMSX gebruikt geen GLU-functies —
      # GLEW_NO_GLU voorkomt de include-keten (BUG-011).
      - "sed -i '1i #define GLEW_NO_GLU' ${FLATPAK_DEST}/include/GL/glew.h"
      # glew-install levert geen dev-symlink; -lGLEW faalt zonder (BUG-011).
      - ln -sf libGLEW.so.2.2.0 ${FLATPAK_DEST}/lib/libGLEW.so.2.2
      - ln -sf libGLEW.so.2.2 ${FLATPAK_DEST}/lib/libGLEW.so
    sources:
      - type: archive
        url: https://github.com/nigels-com/glew/releases/download/glew-2.2.0/glew-2.2.0.tgz
        sha256: d4fc82893cfb00109578d0a1a2337fb8ca335b3ceccf97b97e5cc7f08e4353e1

  # openMSX core — gepinned op tag RELEASE_21_0 (commit cb61db762)
  # Build van openMSX zelf via z'n homemade Make. Geen ./configure stap nodig.
  - name: openmsx
    buildsystem: simple
    build-options:
      env:
        # openMSX-probe zoekt tclConfig.sh alleen in /usr(/local); wijs expliciet
        # naar de Flatpak-prefix waar de tcl-module hem neerzet (BUG-011).
        TCL_CONFIG: /app/lib
        # openMSX-probe linkt direct via g++ zonder -L/app/lib; gcc/ld
        # honoreren LIBRARY_PATH wél (BUG-011).
        LIBRARY_PATH: /app/lib
    build-commands:
      # GLEW-linkpad zit als fork-patch in externals/openmsx (build/libraries.py);
      # 3RDPARTY_INSTALL_DIR=/app bleek de SDL2/PNG-config-scripts te kapen (BUG-011).
      - make -j${FLATPAK_BUILDER_N_JOBS:-4} OPENMSX_TARGET_OS=linux
      - install -Dm755 derived/*-linux-opt/bin/openmsx ${FLATPAK_DEST}/bin/openmsx
      # Volledige share-tree (init.tcl, scripts/, machines/, settings.xml, …)
      # direct onder /app/share/openmsx — bindist/ bestaat alleen bij 'make
      # bindist', bron staat in share/; layout conform OpenmsxLocator (BUG-012).
      - mkdir -p ${FLATPAK_DEST}/share/openmsx
      - cp -r share/. ${FLATPAK_DEST}/share/openmsx/
      # C-BIOS bundeling — open source MSX BIOS replacement (P-SDM-05);
      # XML's + ROM's staan in Contrib/cbios (= wat INSTALL_CONTRIB=true doet).
      - install -Dm644 -t ${FLATPAK_DEST}/share/openmsx/machines Contrib/cbios/*.xml
      - install -Dm644 -t ${FLATPAK_DEST}/share/openmsx/systemroms Contrib/cbios/*.rom
    sources:
      - type: dir
        path: externals/openmsx

  # SteamDeckMSX_Native — Qt6 UI-laag
  - name: steamdeckmsx-ui
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSTEAMDECKMSX_TARGET=steamdeck
      - -DSTEAMDECKMSX_UI_TOOLKIT=qt6
      - -DSTEAMDECKMSX_OPENMSX_LINK=subprocess
      - -DSTEAMDECKMSX_VERSION_CODENAME=KingsValley
    sources:
      - type: dir
        path: .
        skip:
          - externals/openmsx       # apart module hierboven
          - build
          - build-flatpak
          - .flatpak-builder
          - .git
          - releases
