# Flatpak manifest — SteamDeckMSX_Native v0.2.1-KingsValley
#
# REVISIE 2026-07-24 (BUG-011, RCA in BUGLIST.md):
# - runtime org.freedesktop.Platform 23.08 → org.kde.Platform 6.7: fd.o-runtime
#   bevat GEEN Qt6 — vermoedelijke root cause van 5 eerdere buildfails.
#   KDE 6.7 = Qt 6.7 → qzipreader_p.h zit daar nog in QtGui (BUG-009 fallback).
# - --share=network TOEGEVOEGD: herziening v0.0.2-besluit "offline". Sinds
#   v0.1.0 zijn URL-import (ROMs) + BIOS-downloads kernfeatures; hiermee laadt
#   de Deck-app Nemesis 1+2 direct van https://horsecloud55.ddns.net/steam/konami/
# - Overig ongewijzigd: subprocess-koppeling, portal i.p.v. --filesystem=home,
#   Steam Input passthrough via --device=input (P-SDM-06)

app-id: nl.icthorse.SteamDeckMSX
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: steamdeckmsx

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=input
  - --device=dri
  - --persist=.var/app/nl.icthorse.SteamDeckMSX

modules:
  # openMSX core — gepinned op tag RELEASE_21_0 (commit cb61db762)
  # Build van openMSX zelf via z'n homemade Make. Geen ./configure stap nodig.
  - name: openmsx
    buildsystem: simple
    build-commands:
      - make -j${FLATPAK_BUILDER_N_JOBS:-4} OPENMSX_TARGET_OS=linux
      - install -Dm755 derived/*-linux-opt/bin/openmsx ${FLATPAK_DEST}/bin/openmsx
      # C-BIOS bundeling — open source MSX BIOS replacement (P-SDM-05)
      - install -Dm644 -t ${FLATPAK_DEST}/share/openmsx/machines derived/*-linux-opt/bindist/share/machines/*.xml
      - cp -r share/skins ${FLATPAK_DEST}/share/openmsx/skins
    sources:
      - type: dir
        path: externals/openmsx

  # SteamDeckMSX_Native — Qt6 UI-laag
  - name: steamdeckmsx-ui
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSTEAMDECKMSX_TARGET=steamdeck
      - -DSTEAMDECKMSX_UI_TOOLKIT=qt6
      - -DSTEAMDECKMSX_OPENMSX_LINK=subprocess
      - -DSTEAMDECKMSX_VERSION_CODENAME=KingsValley
    sources:
      - type: dir
        path: .
        skip:
          - externals/openmsx       # apart module hierboven
          - build
          - build-flatpak
          - .flatpak-builder
          - .git
          - releases
