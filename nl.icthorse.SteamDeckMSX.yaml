# Flatpak manifest stub — SteamDeckMSX_Native
#
# Status: v0.0.2-Nemesis stub. Niet runnable.
# - openMSX submodule (RELEASE_21_0) wordt door build-system samengevoegd; manifest
#   wijst nog niet naar onze UI-laag (komt v0.0.3+).
# - Real flatpak-builder run pas v0.0.3 zodra CMakeLists.txt staat.
#
# Documentatie van de keuzes hier:
# - runtime org.freedesktop.Platform 23.08 (Qt6 + SDL2 inbegrepen)
# - permissions: minimum — geen netwerk (variant 1 is offline), gamepad via portal,
#   home read-only behalve eigen ~/.var/app/...
# - finish-args volgen P-SDM-06 (Steam Input passthrough — geen raw /dev/input)

app-id: nl.icthorse.SteamDeckMSX
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm18
command: steamdeckmsx

finish-args:
  # GUI access (Wayland preferred, X11 fallback voor Deck Desktop Mode)
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Audio
  - --socket=pulseaudio
  # Gamepad — via Flatpak input-portal (Steam Input compat)
  - --device=input
  # GPU acceleration (Mesa RADV — Steam Deck APU)
  - --device=dri
  # Home: alleen eigen app-data, geen breed home-access
  - --persist=.var/app/nl.icthorse.SteamDeckMSX
  # Bewust GEEN: --share=network (variant 1 = offline-only)
  # Bewust GEEN: --filesystem=home (BIOS/ROMs via Flatpak portal-pickup)

modules:
  # openMSX core — gepinned op RELEASE_21_0 via submodule
  - name: openmsx
    buildsystem: simple
    build-commands:
      # PLACEHOLDER v0.0.3: ./configure + make + install
      # Voor nu: niet bouwen — manifest valideert structuur, niet runtime.
      - echo "openmsx module stub — v0.0.3 build-commands"
    sources:
      - type: dir
        path: externals/openmsx

  # SteamDeckMSX_Native UI-laag (Qt6) — placeholder v0.0.3
  - name: steamdeckmsx-ui
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSTEAMDECKMSX_TARGET=steamdeck
      - -DSTEAMDECKMSX_UI_TOOLKIT=qt6
      - -DSTEAMDECKMSX_OPENMSX_LINK=subprocess
    sources:
      - type: dir
        path: .
        skip:
          - externals/openmsx  # apart module hierboven
          - build
          - .git
