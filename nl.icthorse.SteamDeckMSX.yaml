# Flatpak manifest — SteamDeckMSX_Native v0.0.3-Castlevania
#
# Status: build-commands aanwezig. End-to-end nog niet getest op Steam Deck
# (Christian heeft stap 21 v0.0.3 'skip nu' gekozen — eerste echte run komt v0.0.4).
#
# Beslissingen vastgelegd v0.0.2-Nemesis (ARCHITECTURE.md):
# - runtime org.freedesktop.Platform 23.08
# - UI-toolkit Qt6, koppeling subprocess+control-channel
# - permissies: GEEN --share=network (variant 1 = offline)
#               GEEN --filesystem=home (BIOS/ROMs via Flatpak portal)
# - Steam Input passthrough via --device=input (P-SDM-06)

app-id: nl.icthorse.SteamDeckMSX
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm18
command: steamdeckmsx

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=input
  - --device=dri
  - --persist=.var/app/nl.icthorse.SteamDeckMSX

modules:
  # openMSX core — gepinned op tag RELEASE_21_0 (commit cb61db762)
  # Build van openMSX zelf via z'n homemade Make. Geen ./configure stap nodig.
  - name: openmsx
    buildsystem: simple
    build-commands:
      - make -j${FLATPAK_BUILDER_N_JOBS:-4} OPENMSX_TARGET_OS=linux
      - install -Dm755 derived/*-linux-opt/bin/openmsx ${FLATPAK_DEST}/bin/openmsx
      # C-BIOS bundeling — open source MSX BIOS replacement (P-SDM-05)
      - install -Dm644 -t ${FLATPAK_DEST}/share/openmsx/machines derived/*-linux-opt/bindist/share/machines/*.xml
      - cp -r share/skins ${FLATPAK_DEST}/share/openmsx/skins
    sources:
      - type: dir
        path: externals/openmsx

  # SteamDeckMSX_Native — Qt6 UI-laag
  - name: steamdeckmsx-ui
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSTEAMDECKMSX_TARGET=steamdeck
      - -DSTEAMDECKMSX_UI_TOOLKIT=qt6
      - -DSTEAMDECKMSX_OPENMSX_LINK=subprocess
      - -DSTEAMDECKMSX_VERSION_CODENAME=Castlevania
    sources:
      - type: dir
        path: .
        skip:
          - externals/openmsx       # apart module hierboven
          - build
          - build-flatpak
          - .flatpak-builder
          - .git
          - releases
